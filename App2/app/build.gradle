apply plugin: 'com.android.application'
android {
    namespace 'com.oem.globaldata.app2'
    compileSdk 36
    defaultConfig {
        applicationId 'com.oem.globaldata.app2'
        minSdk 36
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    flavorDimensions 'access'
    productFlavors {
        publicApp { dimension 'access'; buildConfigField 'boolean', 'SYSTEM_SCOPE', 'false' }
        platformApp { dimension 'access'; buildConfigField 'boolean', 'SYSTEM_SCOPE', 'true' }
    }
    buildFeatures { buildConfig true; dataBinding true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    if (System.getenv('PLATFORM_KEYSTORE')) {
        signingConfigs {
            platform {
                storeFile file(System.getenv('PLATFORM_KEYSTORE'))
                storePassword System.getenv('PLATFORM_STORE_PASSWORD')
                keyAlias System.getenv('PLATFORM_KEY_ALIAS')
                keyPassword System.getenv('PLATFORM_KEY_PASSWORD')
            }
        }
        productFlavors.platformApp.signingConfig signingConfigs.platform
    }
}
dependencies { implementation 'com.oem.globaldata:device-contracts:4.0.0' }
